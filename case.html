<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кейс — Bajgart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      font-family: 'Inter', sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .nda-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .nda-card {
      width: 420px;
      max-width: 90vw;
      padding: 48px 40px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.04) 40%, rgba(255,255,255,0.02) 100%);
      backdrop-filter: blur(20px) saturate(1.1);
      -webkit-backdrop-filter: blur(20px) saturate(1.1);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
      text-align: center;
      animation: slideUp 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
    }

    .nda-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 100%);
      border-radius: 24px 24px 0 0;
      pointer-events: none;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .nda-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .nda-icon svg {
      width: 24px;
      height: 24px;
      color: rgba(255,255,255,0.5);
    }

    .nda-card h2 {
      font-size: 22px;
      font-weight: 500;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
      position: relative;
      z-index: 1;
    }

    .nda-card p {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      line-height: 1.6;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }

    .nda-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 100px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      z-index: 1;
    }

    .nda-back:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    .nda-back svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s;
    }

    .nda-back:hover svg {
      transform: translateX(-3px);
    }
  </style>
</head>
<body>
  <div class="nda-overlay">
    <div class="nda-card">
      <div class="nda-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          <circle cx="12" cy="16" r="1"/>
        </svg>
      </div>
      <h2>Проект под NDA</h2>
      <p>Этот кейс находится под соглашением о неразглашении. Подробности проекта доступны только по запросу через личные сообщения.</p>
      <a href="index.html" class="nda-back">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3L5 8L10 13"/>
        </svg>
        На главную
      </a>
    </div>
  </div>
</body>
</html>
