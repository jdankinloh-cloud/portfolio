<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bajgart — Admin Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
  }

  /* Login */
  .login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .login-box {
    width: 340px;
    padding: 32px;
    border-radius: 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
  }
  .login-box h1 {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 24px;
    letter-spacing: -0.02em;
  }
  .login-box input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    margin-bottom: 16px;
  }
  .login-box input:focus { border-color: rgba(255,255,255,0.2); }
  .login-box button {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.2s;
  }
  .login-box button:hover { background: rgba(255,255,255,0.18); }
  .login-error {
    color: #ff6b6b;
    font-size: 12px;
    margin-bottom: 12px;
    display: none;
  }

  /* Dashboard */
  .dashboard { display: none; min-height: 100vh; }
  .dashboard.active { display: flex; }

  /* Sidebar */
  .sidebar {
    width: 280px;
    border-right: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
  }
  .sidebar-header {
    padding: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-header h2 {
    font-size: 14px;
    font-weight: 500;
  }
  .sidebar-header button {
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.5);
    font-size: 11px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .sidebar-header button:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .sidebar-tabs {
    display: flex;
    padding: 12px 16px;
    gap: 4px;
  }
  .sidebar-tab {
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .sidebar-tab.active { background: rgba(255,255,255,0.1); color: #fff; }
  .sidebar-tab:hover { color: rgba(255,255,255,0.7); }
  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .sidebar-list::-webkit-scrollbar { width: 4px; }
  .sidebar-list::-webkit-scrollbar-track { background: transparent; }
  .sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  .sidebar-item {
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
    margin-bottom: 2px;
  }
  .sidebar-item:hover { background: rgba(255,255,255,0.04); }
  .sidebar-item.active { background: rgba(255,255,255,0.08); }
  .sidebar-item-id {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    margin-bottom: 2px;
  }
  .sidebar-item-info {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
  }
  .sidebar-item-time {
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    margin-top: 4px;
  }

  /* Main content */
  .main-content {
    margin-left: 280px;
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .main-header {
    padding: 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .main-header h3 {
    font-size: 14px;
    font-weight: 500;
  }
  .main-header-actions { display: flex; gap: 8px; }
  .main-header-actions button {
    padding: 6px 14px;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.5);
    font-size: 11px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .main-header-actions button:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .main-header-actions .btn-danger:hover { background: rgba(255,80,80,0.2); color: #ff6b6b; }

  .chat-view {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chat-view::-webkit-scrollbar { width: 4px; }
  .chat-view::-webkit-scrollbar-track { background: transparent; }
  .chat-view::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.5;
  }
  .msg.user {
    align-self: flex-end;
    background: rgba(255,255,255,0.1);
    border-top-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: rgba(255,255,255,0.06);
    border-top-left-radius: 4px;
    color: rgba(255,255,255,0.85);
  }
  .msg-time {
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    margin-top: 4px;
  }

  /* RAG editor */
  .rag-view { display: none; }
  .rag-view.active { display: block; }
  .convs-view { display: none; }
  .convs-view.active { display: block; }

  .rag-list {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .rag-item {
    padding: 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .rag-item-q {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .rag-item-a {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    white-space: pre-wrap;
  }
  .rag-item-kw {
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    margin-top: 6px;
  }
  .rag-item-actions {
    margin-top: 8px;
    display: flex;
    gap: 6px;
  }
  .rag-item-actions button {
    padding: 4px 10px;
    border-radius: 6px;
    border: none;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.5);
    font-size: 11px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .rag-item-actions button:hover { background: rgba(255,255,255,0.1); color: #fff; }

  .rag-add {
    margin: 16px;
    padding: 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .rag-add h4 {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 12px;
  }
  .rag-add input, .rag-add textarea {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: #fff;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    outline: none;
    margin-bottom: 8px;
    resize: vertical;
  }
  .rag-add textarea { min-height: 60px; }
  .rag-add input:focus, .rag-add textarea:focus { border-color: rgba(255,255,255,0.15); }
  .rag-add button {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .rag-add button:hover { background: rgba(255,255,255,0.18); }

  .empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    color: rgba(255,255,255,0.15);
    font-size: 14px;
  }

  .stats-bar {
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    display: flex;
    gap: 16px;
  }

  /* Cases View */
  .cases-view { display: none; }
  .cases-view.active { display: block; }

  .cases-list {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .case-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
    transition: all 0.2s;
  }

  .case-item:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.1);
  }

  .case-item.active {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.12);
  }

  .case-item-thumb {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    object-fit: cover;
    background: rgba(255,255,255,0.05);
    flex-shrink: 0;
  }

  .case-item-info { flex: 1; min-width: 0; }

  .case-item-title {
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .case-item-meta {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    margin-top: 2px;
  }

  .case-item-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .case-item:hover .case-item-actions { opacity: 1; }

  .case-item-actions button {
    padding: 4px 8px;
    border-radius: 6px;
    border: none;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  .case-item-actions button:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }

  .case-item-actions .btn-del:hover {
    background: rgba(255,80,80,0.15);
    color: #ff6b6b;
  }

  /* Case Detail View */
  .case-detail {
    padding: 24px;
  }

  .case-detail-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .case-detail-thumb {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    object-fit: cover;
    background: rgba(255,255,255,0.05);
  }

  .case-detail-title {
    font-size: 18px;
    font-weight: 500;
    color: #fff;
  }

  .case-detail-meta {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    margin-top: 4px;
  }

  .case-detail-section {
    margin-bottom: 20px;
  }

  .case-detail-section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: rgba(255,255,255,0.3);
    margin-bottom: 8px;
  }

  .case-detail-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .case-detail-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .case-detail-chip {
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
    color: rgba(255,255,255,0.5);
  }

  .case-detail-image {
    width: 100%;
    max-height: 300px;
    object-fit: cover;
    border-radius: 12px;
    margin-top: 8px;
  }

  /* Case Modal */
  .case-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 24px;
  }

  .case-modal-overlay.active { display: flex; }

  .case-modal {
    width: 520px;
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .case-modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .case-modal-header h3 {
    font-size: 14px;
    font-weight: 500;
  }

  .case-modal-close {
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    font-size: 16px;
    cursor: pointer;
    padding: 4px;
  }

  .case-modal-close:hover { color: #fff; }

  .case-modal-body {
    padding: 20px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }

  #caseForm {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .case-modal-body::-webkit-scrollbar { width: 4px; }
  .case-modal-body::-webkit-scrollbar-track { background: transparent; }
  .case-modal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .case-form-section { margin-bottom: 24px; }
  .case-form-section:last-child { margin-bottom: 0; }

  .case-form-section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: rgba(255,255,255,0.3);
    margin-bottom: 12px;
  }

  .case-form-group { margin-bottom: 12px; }
  .case-form-group:last-child { margin-bottom: 0; }

  .case-form-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    margin-bottom: 4px;
  }

  .case-form-input,
  .case-form-textarea {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: #fff;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    outline: none;
  }

  .case-form-input:focus,
  .case-form-textarea:focus {
    border-color: rgba(255,255,255,0.15);
  }

  .case-form-textarea {
    min-height: 60px;
    resize: vertical;
  }

  .case-form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .case-image-upload {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .case-image-upload .case-form-input { flex: 1; }

  .case-btn {
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .case-btn-primary {
    background: rgba(255,255,255,0.12);
    color: #fff;
  }

  .case-btn-primary:hover { background: rgba(255,255,255,0.18); }

  .case-btn-secondary {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.5);
  }

  .case-btn-secondary:hover { background: rgba(255,255,255,0.1); color: #fff; }

  .case-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
    min-height: 24px;
  }

  .case-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 11px;
    color: rgba(255,255,255,0.5);
  }

  .case-chip button {
    background: none;
    border: none;
    color: rgba(255,255,255,0.3);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
  }

  .case-chip button:hover { color: #fff; }

  .case-add-row {
    display: flex;
    gap: 6px;
  }

  .case-add-row .case-form-input { flex: 1; }

  .case-modal-footer {
    padding: 12px 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .case-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    padding: 10px 16px;
    border-radius: 10px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    color: #fff;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    z-index: 99999;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .case-toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .case-toast.error {
    background: rgba(255,80,80,0.15);
    border-color: rgba(255,80,80,0.2);
  }
</style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>Admin Panel</h1>
    <div class="login-error" id="loginError">Неверный пароль</div>
    <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="off">
    <button id="loginBtn">Войти</button>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Bajgart Admin</h2>
      <button id="logoutBtn">Выйти</button>
    </div>
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-tab="convs">Диалоги</button>
      <button class="sidebar-tab" data-tab="cases">Кейсы</button>
      <button class="sidebar-tab" data-tab="rag">Знания</button>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
    <div class="stats-bar" id="statsBar"></div>
  </div>

  <div class="main-content">
    <!-- Conversations View -->
    <div class="convs-view active" id="convsView">
      <div class="main-header">
        <h3 id="convTitle">Выберите диалог</h3>
        <div class="main-header-actions" id="convActions" style="display:none">
          <button class="btn-danger" id="deleteConvBtn">Удалить диалог</button>
        </div>
      </div>
      <div class="chat-view" id="chatView">
        <div class="empty-state">Выберите диалог слева</div>
      </div>
    </div>

    <!-- RAG View -->
    <div class="rag-view" id="ragView">
      <div class="main-header">
        <h3>База знаний RAG</h3>
      </div>
      <div class="rag-add">
        <h4>Добавить запись</h4>
        <input type="text" id="ragQuestion" placeholder="Вопрос">
        <textarea id="ragAnswer" placeholder="Ответ"></textarea>
        <input type="text" id="ragKeywords" placeholder="Ключевые слова (через проб)">
        <button id="ragAddBtn">Добавить</button>
      </div>
      <div class="rag-list" id="ragList"></div>
    </div>

    <!-- Cases View -->
    <div class="cases-view" id="casesView">
      <div class="main-header">
        <h3>Кейсы</h3>
        <div class="main-header-actions">
          <button id="addCaseBtn">+ Добавить</button>
        </div>
      </div>
      <div class="cases-list" id="casesList"></div>
    </div>
  </div>
</div>

<!-- Case Modal -->
<div class="case-modal-overlay" id="caseModalOverlay">
  <div class="case-modal">
    <div class="case-modal-header">
      <h3 id="caseModalTitle">Новый кейс</h3>
      <button class="case-modal-close" id="caseModalClose">✕</button>
    </div>
    <form id="caseForm" onsubmit="return false;">
      <input type="hidden" id="caseId">
      <div class="case-modal-body">
        <div class="case-form-section">
          <div class="case-form-section-title">Основное</div>
          <div class="case-form-group">
            <label class="case-form-label">ID (slug)</label>
            <input type="text" class="case-form-input" id="caseSlug" placeholder="e.g. gam" required>
          </div>
          <div class="case-form-group">
            <label class="case-form-label">Название</label>
            <input type="text" class="case-form-input" id="caseTitle" placeholder="Название проекта" required>
          </div>
          <div class="case-form-group">
            <label class="case-form-label">Описание</label>
            <textarea class="case-form-textarea" id="caseDescription" placeholder="Краткое описание"></textarea>
          </div>
          <div class="case-form-row">
            <div class="case-form-group">
              <label class="case-form-label">Номер проекта</label>
              <input type="text" class="case-form-input" id="caseProjectNumber" placeholder="01">
            </div>
            <div class="case-form-group">
              <label class="case-form-label">Индустрия</label>
              <input type="text" class="case-form-input" id="caseIndustry" placeholder="e.g. Gaming">
            </div>
          </div>
          <div class="case-form-group">
            <label class="case-form-label">Дата публикации</label>
            <input type="text" class="case-form-input" id="casePublished" placeholder="e.g. March 2025">
          </div>
        </div>
        <div class="case-form-section">
          <div class="case-form-section-title">Изображения</div>
          <div class="case-form-group">
            <label class="case-form-label">Обложка</label>
            <div class="case-image-upload">
              <input type="text" class="case-form-input" id="caseImageUrl" placeholder="https://...">
              <input type="file" id="caseImageFile" accept="image/*" style="display:none;" onchange="uploadCaseImage(this, 'caseImageUrl', 'caseImagePreview')">
              <button type="button" class="case-btn case-btn-secondary" onclick="document.getElementById('caseImageFile').click()">↑</button>
            </div>
            <div id="caseImagePreview"></div>
          </div>
          <div class="case-form-group">
            <label class="case-form-label">Иконка</label>
            <div class="case-image-upload">
              <input type="text" class="case-form-input" id="caseIconImageUrl" placeholder="https://...">
              <input type="file" id="caseIconFile" accept="image/*" style="display:none;" onchange="uploadCaseImage(this, 'caseIconImageUrl', 'caseIconPreview')">
              <button type="button" class="case-btn case-btn-secondary" onclick="document.getElementById('caseIconFile').click()">↑</button>
            </div>
            <div id="caseIconPreview"></div>
          </div>
        </div>
        <div class="case-form-section">
          <div class="case-form-section-title">Deliverables</div>
          <div class="case-chips" id="caseDeliverablesContainer"></div>
          <div class="case-add-row">
            <input type="text" class="case-form-input" id="caseDeliverableInput" placeholder="Добавить...">
            <button type="button" class="case-btn case-btn-secondary" onclick="addCaseDeliverable()">+</button>
          </div>
        </div>
        <div class="case-form-section">
          <div class="case-form-section-title">Теги</div>
          <div class="case-chips" id="caseTagsContainer"></div>
          <div class="case-add-row">
            <input type="text" class="case-form-input" id="caseTagInput" placeholder="Добавить тег...">
            <button type="button" class="case-btn case-btn-secondary" onclick="addCaseTag()">+</button>
          </div>
        </div>
      </div>
      <div class="case-modal-footer">
        <button type="button" class="case-btn case-btn-secondary" onclick="closeCaseModal()">Отмена</button>
        <button type="button" class="case-btn case-btn-primary" onclick="saveCase()">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div class="case-toast" id="caseToast"></div>

<script>
const loginScreen = document.getElementById('loginScreen');
const dashboard = document.getElementById('dashboard');
const loginPassword = document.getElementById('loginPassword');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const logoutBtn = document.getElementById('logoutBtn');
const sidebarList = document.getElementById('sidebarList');
const chatView = document.getElementById('chatView');
const convTitle = document.getElementById('convTitle');
const convActions = document.getElementById('convActions');
const deleteConvBtn = document.getElementById('deleteConvBtn');
const statsBar = document.getElementById('statsBar');
const ragList = document.getElementById('ragList');
const ragAddBtn = document.getElementById('ragAddBtn');

let selectedConvId = null;
let currentTab = 'convs';

async function api(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    credentials: 'same-origin'
  });
  return res;
}

// Login
loginBtn.addEventListener('click', async () => {
  const pwd = loginPassword.value;
  if (!pwd) return;
  const res = await api('/api/admin/login', {
    method: 'POST',
    body: JSON.stringify({ password: pwd })
  });
  if (res.ok) {
    loginScreen.style.display = 'none';
    dashboard.classList.add('active');
    loadConversations();
  } else {
    loginError.style.display = 'block';
    loginPassword.value = '';
  }
});

loginPassword.addEventListener('keydown', e => {
  if (e.key === 'Enter') loginBtn.click();
});

logoutBtn.addEventListener('click', async () => {
  await api('/api/admin/logout', { method: 'POST' });
  dashboard.classList.remove('active');
  loginScreen.style.display = 'flex';
  loginPassword.value = '';
});

// Check auth on load
async function checkAuth() {
  const res = await api('/api/admin/check');
  if (res.ok) {
    loginScreen.style.display = 'none';
    dashboard.classList.add('active');
    loadConversations();
  }
}
checkAuth();

// Tabs
document.querySelectorAll('.sidebar-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    document.getElementById('convsView').classList.toggle('active', currentTab === 'convs');
    document.getElementById('ragView').classList.toggle('active', currentTab === 'rag');
    document.getElementById('casesView').classList.toggle('active', currentTab === 'cases');
    if (currentTab === 'rag') loadRag();
    if (currentTab === 'convs') loadConversations();
    if (currentTab === 'cases') loadCases();
  });
});

// Conversations
async function loadConversations() {
  const res = await api('/api/admin/conversations');
  if (!res.ok) return;
  const convs = await res.json();

  sidebarList.innerHTML = '';
  if (convs.length === 0) {
    sidebarList.innerHTML = '<div style="padding:12px;color:rgba(255,255,255,0.2);font-size:12px">Нет диалогов</div>';
  }

  let totalMsgs = 0;
  for (const c of convs) {
    totalMsgs += c.message_count;
    const div = document.createElement('div');
    div.className = 'sidebar-item' + (c.id === selectedConvId ? ' active' : '');
    div.innerHTML = `
      <div class="sidebar-item-id">${c.visitor_id.slice(0,8)}...</div>
      <div class="sidebar-item-info">${c.message_count} сообщений</div>
      <div class="sidebar-item-time">${new Date(c.updated_at).toLocaleString('ru')}</div>
    `;
    div.addEventListener('click', () => selectConversation(c.id));
    sidebarList.appendChild(div);
  }

  statsBar.innerHTML = `<span>Диалогов: ${convs.length}</span><span>Сообщений: ${totalMsgs}</span>`;
}

async function selectConversation(id) {
  selectedConvId = id;
  const res = await api(`/api/admin/conversations/${id}`);
  if (!res.ok) return;
  const data = await res.json();

  convTitle.textContent = `Диалог ${id.slice(0,8)}...`;
  convActions.style.display = 'flex';

  chatView.innerHTML = '';
  for (const m of data.messages) {
    const div = document.createElement('div');
    div.className = `msg ${m.role}`;
    div.innerHTML = `${m.content.replace(/\n/g, '<br>')}<div class="msg-time">${new Date(m.created_at).toLocaleString('ru')}</div>`;
    chatView.appendChild(div);
  }
  chatView.scrollTop = chatView.scrollHeight;

  loadConversations();
}

deleteConvBtn.addEventListener('click', async () => {
  if (!selectedConvId) return;
  if (!confirm('Удалить этот диалог?')) return;
  await api(`/api/admin/conversations/${selectedConvId}`, { method: 'DELETE' });
  selectedConvId = null;
  convTitle.textContent = 'Выберите диалог';
  convActions.style.display = 'none';
  chatView.innerHTML = '<div class="empty-state">Выберите диалог слева</div>';
  loadConversations();
});

// RAG
async function loadRag() {
  const res = await api('/api/admin/rag');
  if (!res.ok) return;
  const items = await res.json();

  ragList.innerHTML = '';
  for (const item of items) {
    const div = document.createElement('div');
    div.className = 'rag-item';
    div.innerHTML = `
      <div class="rag-item-q">${item.question}</div>
      <div class="rag-item-a">${item.answer}</div>
      <div class="rag-item-kw">${item.keywords}</div>
      <div class="rag-item-actions">
        <button onclick="deleteRag(${item.id})">Удалить</button>
      </div>
    `;
    ragList.appendChild(div);
  }
}

ragAddBtn.addEventListener('click', async () => {
  const q = document.getElementById('ragQuestion').value.trim();
  const a = document.getElementById('ragAnswer').value.trim();
  const k = document.getElementById('ragKeywords').value.trim();
  if (!q || !a) return;
  await api('/api/admin/rag', {
    method: 'POST',
    body: JSON.stringify({ question: q, answer: a, keywords: k })
  });
  document.getElementById('ragQuestion').value = '';
  document.getElementById('ragAnswer').value = '';
  document.getElementById('ragKeywords').value = '';
  loadRag();
});

window.deleteRag = async (id) => {
  if (!confirm('Удалить запись?')) return;
  await api(`/api/admin/rag/${id}`, { method: 'DELETE' });
  loadRag();
};

// Auto refresh
setInterval(() => {
  if (currentTab === 'convs') loadConversations();
  if (currentTab === 'cases') loadCases();
}, 10000);

// Cases
const casesView = document.getElementById('casesView');
const casesListEl = document.getElementById('casesList');
const caseModalOverlay = document.getElementById('caseModalOverlay');
const caseModalTitle = document.getElementById('caseModalTitle');
const caseForm = document.getElementById('caseForm');
const caseIdInput = document.getElementById('caseId');
const caseSlugInput = document.getElementById('caseSlug');
const caseTitleInput = document.getElementById('caseTitle');
const caseDescInput = document.getElementById('caseDescription');
const caseProjectNumInput = document.getElementById('caseProjectNumber');
const caseIndustryInput = document.getElementById('caseIndustry');
const casePublishedInput = document.getElementById('casePublished');
const caseImageUrlInput = document.getElementById('caseImageUrl');
const caseIconImageUrlInput = document.getElementById('caseIconImageUrl');
const caseDeliverableInput = document.getElementById('caseDeliverableInput');
const caseTagInput = document.getElementById('caseTagInput');
const caseDeliverablesContainer = document.getElementById('caseDeliverablesContainer');
const caseTagsContainer = document.getElementById('caseTagsContainer');
const caseImagePreview = document.getElementById('caseImagePreview');
const caseIconPreview = document.getElementById('caseIconPreview');
const caseToast = document.getElementById('caseToast');

let currentCases = [];
let editingCaseId = null;
let caseDeliverables = [];
let caseTags = [];

async function loadCases() {
  const res = await api('/api/cases');
  if (!res.ok) return;
  currentCases = await res.json();
  renderCasesList();
}

function renderCasesList() {
  if (currentCases.length === 0) {
    casesListEl.innerHTML = '<div style="padding:24px;text-align:center;color:rgba(255,255,255,0.2);font-size:13px">Нет кейсов</div>';
    return;
  }

  casesListEl.innerHTML = '';
  for (const c of currentCases) {
    const div = document.createElement('div');
    div.className = 'case-item';
    div.dataset.id = c.id;
    div.innerHTML = `
      <img class="case-item-thumb" src="${c.imageUrl || c.image_url || ''}" alt="" onerror="this.style.display='none'">
      <div class="case-item-info">
        <div class="case-item-title">${c.title || c.slug}</div>
        <div class="case-item-meta">${c.industry || ''}${c.industry && c.published ? ' · ' : ''}${c.published || ''}</div>
      </div>
      <div class="case-item-actions">
        <button onclick="editCase('${c.id}')">✎</button>
        <button class="btn-del" onclick="deleteCase('${c.id}')">✕</button>
      </div>
    `;
    div.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      viewCase(c.id);
    });
    casesListEl.appendChild(div);
  }
}

function viewCase(id) {
  const c = currentCases.find(x => x.id === id);
  if (!c) return;

  const chips = (c.deliverables || []).map(d => `<span class="case-detail-chip">${d}</span>`).join('');
  const tags = (c.tags || []).map(t => `<span class="case-detail-chip">${t}</span>`).join('');

  casesListEl.innerHTML = `
    <div class="case-detail">
      <button class="case-btn case-btn-secondary" onclick="renderCasesList()" style="margin-bottom:16px">← Назад к списку</button>
      <div class="case-detail-header">
        <img class="case-detail-thumb" src="${c.imageUrl || c.image_url || ''}" alt="" onerror="this.style.display='none'">
        <div>
          <div class="case-detail-title">${c.title || c.slug}</div>
          <div class="case-detail-meta">${c.industry || ''}${c.industry && c.published ? ' · ' : ''}${c.published || ''}</div>
        </div>
      </div>
      ${c.description ? `<div class="case-detail-section"><div class="case-detail-section-title">Описание</div><div class="case-detail-desc">${c.description}</div></div>` : ''}
      ${c.projectNumber || c.project_number ? `<div class="case-detail-section"><div class="case-detail-section-title">Номер проекта</div><div class="case-detail-desc">${c.projectNumber || c.project_number}</div></div>` : ''}
      ${chips ? `<div class="case-detail-section"><div class="case-detail-section-title">Deliverables</div><div class="case-detail-chips">${chips}</div></div>` : ''}
      ${tags ? `<div class="case-detail-section"><div class="case-detail-section-title">Теги</div><div class="case-detail-chips">${tags}</div></div>` : ''}
      ${c.imageUrl || c.image_url ? `<div class="case-detail-section"><div class="case-detail-section-title">Обложка</div><img class="case-detail-image" src="${c.imageUrl || c.image_url}" alt=""></div>` : ''}
      ${c.iconImageUrl || c.icon_url ? `<div class="case-detail-section"><div class="case-detail-section-title">Иконка</div><img class="case-detail-image" src="${c.iconImageUrl || c.icon_url}" alt="" style="max-height:120px"></div>` : ''}
    </div>
  `;
}

window.editCase = function(id) {
  const c = currentCases.find(x => x.id === id);
  if (!c) return;

  editingCaseId = id;
  caseModalTitle.textContent = 'Редактировать кейс';
  caseIdInput.value = c.id;
  caseSlugInput.value = c.slug || '';
  caseTitleInput.value = c.title || '';
  caseDescInput.value = c.description || '';
  caseProjectNumInput.value = c.projectNumber || c.project_number || '';
  caseIndustryInput.value = c.industry || '';
  casePublishedInput.value = c.published || '';
  caseImageUrlInput.value = c.imageUrl || c.image_url || '';
  caseIconImageUrlInput.value = c.iconImageUrl || c.icon_url || '';

  caseDeliverables = [...(c.deliverables || [])];
  caseTags = [...(c.tags || [])];
  renderCaseChips();
  renderCaseImagePreview();

  caseModalOverlay.classList.add('active');
};

window.deleteCase = async function(id) {
  if (!confirm('Удалить этот кейс?')) return;
  const res = await api(`/api/cases/${id}`, { method: 'DELETE' });
  if (res.ok) {
    showCaseToast('Кейс удалён');
    loadCases();
  } else {
    showCaseToast('Ошибка удаления', true);
  }
};

document.getElementById('addCaseBtn').addEventListener('click', () => {
  editingCaseId = null;
  caseModalTitle.textContent = 'Новый кейс';
  caseForm.reset();
  caseIdInput.value = '';
  caseDeliverables = [];
  caseTags = [];
  caseImagePreview.innerHTML = '';
  caseIconPreview.innerHTML = '';
  renderCaseChips();
  caseModalOverlay.classList.add('active');
});

document.getElementById('caseModalClose').addEventListener('click', closeCaseModal);
caseModalOverlay.addEventListener('click', (e) => {
  if (e.target === caseModalOverlay) closeCaseModal();
});

function closeCaseModal() {
  caseModalOverlay.classList.remove('active');
}

window.addCaseDeliverable = function() {
  const val = caseDeliverableInput.value.trim();
  if (!val) return;
  caseDeliverables.push(val);
  caseDeliverableInput.value = '';
  renderCaseChips();
};

caseDeliverableInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); window.addCaseDeliverable(); }
});

window.addCaseTag = function() {
  const val = caseTagInput.value.trim();
  if (!val) return;
  caseTags.push(val);
  caseTagInput.value = '';
  renderCaseChips();
};

caseTagInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); window.addCaseTag(); }
});

function renderCaseChips() {
  caseDeliverablesContainer.innerHTML = caseDeliverables.map((d, i) =>
    `<span class="case-chip">${d}<button onclick="removeCaseDeliverable(${i})">×</button></span>`
  ).join('');

  caseTagsContainer.innerHTML = caseTags.map((t, i) =>
    `<span class="case-chip">${t}<button onclick="removeCaseTag(${i})">×</button></span>`
  ).join('');
}

window.removeCaseDeliverable = function(i) {
  caseDeliverables.splice(i, 1);
  renderCaseChips();
};

window.removeCaseTag = function(i) {
  caseTags.splice(i, 1);
  renderCaseChips();
};

function renderCaseImagePreview() {
  if (caseImageUrlInput.value) {
    caseImagePreview.innerHTML = `<img src="${caseImageUrlInput.value}" style="max-height:60px;border-radius:6px;margin-top:6px" onerror="this.style.display='none'">`;
  } else {
    caseImagePreview.innerHTML = '';
  }

  if (caseIconImageUrlInput.value) {
    caseIconPreview.innerHTML = `<img src="${caseIconImageUrlInput.value}" style="max-height:60px;border-radius:6px;margin-top:6px" onerror="this.style.display='none'">`;
  } else {
    caseIconPreview.innerHTML = '';
  }
}

caseImageUrlInput.addEventListener('input', renderCaseImagePreview);
caseIconImageUrlInput.addEventListener('input', renderCaseImagePreview);

window.uploadCaseImage = async function(input, targetId, previewId) {
  const file = input.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('image', file);

  try {
    const res = await fetch('/api/upload', {
      method: 'POST',
      credentials: 'same-origin',
      body: formData
    });

    if (res.ok) {
      const data = await res.json();
      document.getElementById(targetId).value = data.url;
      renderCaseImagePreview();
      showCaseToast('Изображение загружено');
    } else {
      showCaseToast('Ошибка загрузки', true);
    }
  } catch (e) {
    showCaseToast('Ошибка загрузки', true);
  }
};

window.saveCase = async function() {
  const slug = caseSlugInput.value.trim();
  const title = caseTitleInput.value.trim();
  if (!slug || !title) {
    showCaseToast('Заполните ID и название', true);
    return;
  }

  const payload = {
    id: editingCaseId || crypto.randomUUID(),
    slug,
    title,
    description: caseDescInput.value.trim(),
    projectNumber: caseProjectNumInput.value.trim(),
    industry: caseIndustryInput.value.trim(),
    published: casePublishedInput.value.trim(),
    imageUrl: caseImageUrlInput.value.trim(),
    iconImageUrl: caseIconImageUrlInput.value.trim(),
    deliverables: caseDeliverables,
    tags: caseTags
  };

  try {
    let res;
    if (editingCaseId) {
      res = await api(`/api/cases/${editingCaseId}`, {
        method: 'PUT',
        body: JSON.stringify(payload)
      });
    } else {
      res = await api('/api/cases', {
        method: 'POST',
        body: JSON.stringify(payload)
      });
    }

    if (res.ok) {
      showCaseToast(editingCaseId ? 'Кейс обновлён' : 'Кейс создан');
      closeCaseModal();
      loadCases();
    } else {
      showCaseToast('Ошибка сохранения', true);
    }
  } catch (e) {
    showCaseToast('Ошибка сети', true);
  }
};

function showCaseToast(msg, isError = false) {
  caseToast.textContent = msg;
  caseToast.className = 'case-toast' + (isError ? ' error' : '');
  requestAnimationFrame(() => {
    caseToast.classList.add('show');
  });
  setTimeout(() => {
    caseToast.classList.remove('show');
  }, 2500);
}
</script>
</body>
</html>
